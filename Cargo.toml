[package]
name = "otpx"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["柒 <linqi0201@hotmail.com>"]
description = "RFC 4226 & RFC 6238 compatible OTP (One-Time Password) implementation"
repository = "https://github.com/lin1328/otpx"
readme = "README.md"
license = "MIT"
keywords = ["totp", "hotp", "2fa", "authentication", "steam-guard"]
categories = ["authentication", "cryptography"]

[dependencies]
data-encoding = { version = "2.10", default-features = false, features = ["alloc"] }
hmac = "0.12"
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
zeroize = { version = "1.8", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
getrandom = "0.4"
serde_json = "1.0"

[features]
default = ["std"]
std = []
steam = []
zeroize = ["dep:zeroize"]
serde = ["dep:serde"]

[profile.release]
lto = true

[profile.bench]
debug = true
lto = true
